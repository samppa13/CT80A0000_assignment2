<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Library Management</title>
		<link rel="icon" href="data:,">
		<link rel="stylesheet" href="./styles/styles.css">
	</head>
	<body>
		<header class="topbar">
			<div class="brand-mark" aria-hidden="true">L</div>
			<div>
				<p class="eyebrow">LIBRARY MANAGEMENT</p>
				<h1>Library Databases</h1>
			</div>
		</header>
		<main class="layout">
			<section class="intro">
				<h2>DASHBOARD</h2>
				<p>Select a database, view its data, and add, edit, or delete records.</p>
			</section>
			<section class="controls panel">
				<div class="selector-wrap">
					<label for="databaseSelect">Select a database</label>
					<select id="databaseSelect">
						<option value="books">Books</option>
						<option value="customers">Customers</option>
						<option value="loans">Loans</option>
					</select>
				</div>
				<div class="db-info">
					<span class="status-dot"></span>
					<span id="dbDescription">Library books</span>
				</div>
				<button id="addButton" class="button primary">+ Add record</button>
			</section>
			<section class="panel table-panel">
				<div class="table-heading">
					<div>
						<h2 id="tableTitle">Books</h2>
					</div>
					<span id="recordCount" class="count-pill">0 records</span>
				</div>
				<div id="message" role="status" class="message hidden"></div>
				<div class="table-scroll">
					<table>
						<thead id="tableHead"></thead>
						<tbody id="tableBody"></tbody>
					</table>
				</div>
				<div id="emptyState" class="empty-state hidden">There are no records in this database yet.</div>
			</section>
		</main>
		<dialog id="recordDialog">
			<form id="recordForm">
				<div class="dialog-heading">
					<div>
						<p id="dialogDetails" class="eyebrow">RECORD DETAILS</p>
						<h2 id="dialogTitle">Add record</h2>
					</div>
					<button type="button" id="closeDialog" class="icon-button" aria-label="Close">×</button>
				</div>
				<div id="formFields" class="form-fields"></div>
				<p id="formError" class="form-error"></p>
				<div class="dialog-actions">
					<button type="button" id="cancelButton" class="button secondary">Cancel</button>
					<button type="submit" class="button primary">Save</button>
				</div>
			</form>
		</dialog>
		<script type="module" src="/js/app.js"></script>
	</body>
</html>
